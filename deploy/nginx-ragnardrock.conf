# Configuration nginx de ragnardrock.fr (à copier dans /etc/nginx/sites-available/).
# Le HTTPS est ajouté ensuite par certbot (voir LISEZMOI.md).

server {
    listen 80;
    listen [::]:80;
    server_name ragnardrock.fr www.ragnardrock.fr;

    root /var/www/ragnardrock.fr;
    index index.html;

    # Le site est une application Vue : toute adresse inconnue renvoie index.html,
    # et c'est Vue qui affiche la bonne page (ou « Page introuvable »).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers construits portent leur empreinte dans leur nom : on peut les garder longtemps.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # La copie des versions change à chaque déploiement.
    location = /releases.json {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
